<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ej2.css">
    <style>
        body {
            width: 40%;
        }

        #cabeceira {
            background-color: black;
            padding: 1px;
            color: yellow;
        }

        p {
            padding: 5px;
        }

        #corpo {
            display: flex;
            height: 400px;
        }

        #navegacion {
            background-color: grey;
            display: flex;
            flex-direction: column;
            padding: 50px;
            font-size: 13px;
            width: 10%;
        }

        a {
            color: rgb(102, 255, 0);
        }

        #contido {
            background-color: rgb(224, 221, 221);
            color: rgb(218, 24, 218);
            width: 90%;
        }

        #pe {
            background-color: rgb(192, 192, 192);
            color: brown;
            padding: 1px;
            text-align: center;
        }

        h1 {
            padding: 5px;
        }
    </style>
</head>

<body>
    <div id="cabeceira">
        <p>Párrafo en la cabecera de la página.</p>
    </div>
    <div id="corpo">
        <div id="navegacion">
            <a href="#">Enlace 1</a>
            <a href="#">Enlace 2</a>
            <a href="#">Enlace 3</a>
        </div>
        <div id="contido">
            <h1>Ejemplo: Uso del elemento "div" y del atributo <i>id</i></h1>
        </div>
    </div>
    <div id="pe">
        <p>Párrafo en el pie de la página.</p>
    </div>
</body>

</html>
