<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
    }

    #contorno {
      width: 700px;
      height: 700px;
      border: 2px solid rgb(0, 0, 0);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      padding: 10px;
    }

    #rojo {
      background-color: red;
      grid-column: 1;
      grid-row: 2;
    }

    #verde {
      background-color: green;
      grid-column: 1;
      grid-row: 1;
    }

    #azul {
      height: 57%;
      background-color: rgb(6, 10, 247);
      grid-column: 2;
      grid-row: 1;
    }

    #morado {
      margin-top: 60%;
      height: 70%;
      background-color: rgb(121, 46, 182);
      grid-column: 2;
      grid-row: 1/3;

    }
  </style>
</head>

<body>
  <div id="contorno">

    <div id="verde"></div>
    <div id="rojo"></div>
    <div id="azul"></div>
    <div id="morado"></div>


  </div>
</body>

</html>
