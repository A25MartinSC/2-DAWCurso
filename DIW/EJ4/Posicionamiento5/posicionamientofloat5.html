<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
    }

    #contorno {
      width: 525px;
      height: 452px;
    }

    #formas2 {
      float: right;
      width: 34.29%;
      height: 100%;
    }


    #formas1 {
      float: left;
      width: 62%;
      height: 100%;
    }

    #turquesa {
      width: 100%;
      height: 48%;
      margin-bottom: 4%;
      background-color: rgb(124, 241, 195);
    }

    #rosa {
      float: right;
      width: 57%;
      height: 50%;
      background-color: rgb(233, 91, 214);
    }

    #caja11 {
      margin: 1%;
      width: 38%;
      height: 50%;
      float: left;
    }

    #rojo {
      width: 100%;
      height: 29%;
      margin-bottom: 12%;
      background-color: red;
    }

    #naranja {
      width: 100%;
      height: 64%;
      background-color: rgb(255, 107, 0);
    }

    #verde {
      width: 100%;
      height: 24%;
      margin-bottom: 8%;
      background-color: rgb(74, 148, 6);
    }

    #azul {
      width: 100%;
      height: 57%;
      margin-bottom: 8%;
      background-color: rgb(45, 126, 207);
    }

    #marron {
      width: 100%;
      height: 13%;
      background-color: rgb(221, 181, 121);
    }
  </style>
</head>

<body>
  <div id="contorno">
    <div id="formas1">

      <div id="turquesa"></div>

      <div id="rosa"></div>

      <div id="caja11">
        <div id="rojo"></div>
        <div id="naranja"></div>
      </div>


    </div>

    <div id="formas2">

      <div id="verde"></div>


      <div id="azul"></div>
      <div id="marron"></div>


    </div>
  </div>
</body>

</html>
