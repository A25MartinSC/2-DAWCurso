<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        #contorno {
            width: 525px;
            height: 452px;
            display: flex;
            justify-content: space-between;
        }

        #formas1 {
            width: 62.86%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-content: space-between;
        }

        #formas2 {
            width: 34.29%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #turquesa {
            width: 100%;
            height: 48.67%;
            background-color: rgb(124, 241, 195);
        }

        #caja11 {
            order: 1;
            width: 37.88%;
            height: 48.01%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #rosa {
            order: 2;
            width: 57.58%;
            height: 48.01%;
            background-color: rgb(233, 91, 214);
        }

        #rojo {
            height: 29.03%;
            background-color: red;
        }

        #naranja {
            height: 64.06%;
            background-color: rgb(255, 107, 0);
        }


        #verde {
            height: 24.34%;
            background-color: rgb(74, 148, 6);
        }

        #azul {
            height: 57.96%;
            background-color: rgb(45, 126, 207);
        }

        #marron {
            height: 11.06%;
            background-color: rgb(221, 181, 121);
        }
    </style>
</head>

<body>
    <div id="contorno">
        <div id="formas1">

            <div id="turquesa"></div>

            <div id="rosa"></div>

            <div id="caja11">
                <div id="rojo"></div>
                <div id="naranja"></div>
            </div>

        </div>

        <div id="formas2">

            <div id="verde"></div>
            <div id="azul"></div>
            <div id="marron"></div>

        </div>
    </div>
</body>

</html>
