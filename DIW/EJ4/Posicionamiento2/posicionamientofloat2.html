<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        #contorno {
            float: left;
            width: 550px;
            padding: 50px;
            border: 1px dotted brown;
            overflow: auto;
            height: 35%;

        }

        div {
            width: 200px;
            height: 150px;
        }

        #amarillo {
            float: left;
            background-color: rgb(248, 222, 104);
            border: 1px solid rgb(0, 0, 0);

        }

        #azul {
            float: left;
            background-color: rgb(194, 236, 255);
            border: 1px solid brown;
        }
    </style>
</head>

<body>
    <div id="contorno">
        <div id="amarillo"></div>
        <div id="azul"></div>
    </div>
</body>

</html>
