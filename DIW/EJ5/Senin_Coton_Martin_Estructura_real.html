<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura semántica</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            font-weight: bold;
            text-align: center;
            font-size: 1.1rem;
        }


        .contenedor {
            display: flex;
            flex-direction: column;
            height: 100vh;
            gap: 10px;
        }

        header {
            width: 100%;
            height: 80px;
            background-color: rgb(214, 97, 97);
            display: flex;
            align-items: center;
            justify-content: center;


        }

        .medio {
            display: flex;
            flex-grow: 1;
            gap: 10px;
        }

        nav {
            width: 150px;
            background-color: rgb(214, 97, 97);
            display: flex;
            align-items: center;
            justify-content: center;


        }

        aside {
            width: 150px;
            background-color: rgb(214, 97, 97);
            display: flex;
            align-items: center;
            justify-content: center;


        }

        section {
            flex-grow: 1;
            background-color: rgb(214, 97, 97);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;


        }

        .etiqueta {
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        section header {
            height: 60px;
            background-color: rgb(199, 192, 91);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        article {
            flex-grow: 1;
            background-color: rgb(199, 192, 91);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        section footer {
            height: 100px;
            background-color: rgb(199, 192, 91);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pie {
            width: 100%;
            height: 80px;
            background-color: rgb(214, 97, 97);
            display: flex;
            align-items: center;
            justify-content: center;


        }
    </style>
</head>

<body>

    <div class="contenedor">

        <header>&lt;header&gt;</header>

        <div class="medio">

            <nav>&lt;nav&gt;</nav>

            <section>
                <p class="etiqueta">&lt;section&gt;</p>
                <header>&lt;header&gt;</header>
                <article>&lt;article&gt;</article>
                <footer>&lt;footer&gt;</footer>
            </section>

            <aside>&lt;aside&gt;</aside>

        </div>

        <footer class="pie">&lt;footer&gt;</footer>

    </div>

</body>

</html>
